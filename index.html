<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><meta name="description" content="Forging Performance — planilhas e acompanhamento de atletas"><title>Forging Performance | Treinos</title><style>:root{color-scheme:dark;--bg:#0b0c0f;--panel:#17191e;--line:#292c33;--ink:#f4f4f5;--muted:#a5a6ad;--accent:#ea443e;--radius:18px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100dvh;max-width:1240px;margin:auto;display:grid;grid-template-columns:250px 1fr}.sidebar{border-right:1px solid var(--line);padding:30px 20px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;gap:12px;align-items:center}.brandmark{width:45px;height:45px;display:grid;place-items:center;background:var(--accent);color:white;font-weight:1000;font-size:23px;letter-spacing:-3px;transform:skew(-9deg);border-radius:10px}.brand strong{display:block;font-size:16px;letter-spacing:.02em}.brand span{font-size:11px;color:var(--muted);letter-spacing:.17em}.nav{display:grid;gap:7px}.nav button,.switch button{width:100%;text-align:left;background:transparent;color:var(--muted);border:0;border-radius:11px;padding:12px 14px}.nav button.active,.nav button:hover{background:#292024;color:#fff}.nav button.active{border-left:3px solid var(--accent)}.switch{margin-top:auto;padding-top:20px;border-top:1px solid var(--line)}.switch label{display:block;color:var(--muted);font-size:12px;margin:0 0 8px}.switch select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:white;padding:12px}.content{padding:30px 40px 70px;min-width:0}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}.eyebrow{text-transform:uppercase;color:var(--accent);font-size:11px;letter-spacing:.19em;font-weight:800}.head h1{font-size:clamp(25px,4vw,36px);letter-spacing:-.04em;margin:7px 0 0}.muted{color:var(--muted)}.pill{background:#302025;color:#ff938e;border:1px solid #593335;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:700}.hero{background:linear-gradient(110deg,#262025,#17191e 70%);border:1px solid #392c30;border-radius:24px;padding:30px;position:relative;overflow:hidden}.hero:after{content:'FP';position:absolute;right:10px;bottom:-80px;line-height:1;font-size:240px;font-weight:1000;color:#ffffff08;letter-spacing:-25px;pointer-events:none}.hero h2{font-size:clamp(25px,4vw,43px);letter-spacing:-.05em;max-width:600px;margin:10px 0}.hero p{max-width:560px;line-height:1.6;color:#c5c2c5}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.btn{border:1px solid var(--line);background:#24262c;color:#fff;border-radius:11px;padding:11px 16px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent)}.btn.ghost{background:transparent}.btn.small{padding:8px 11px;font-size:12px}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #ffa6a1;outline-offset:2px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:22px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:19px}.stat b{font-size:31px;display:block;letter-spacing:-.05em}.stat span{font-size:13px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:32px 0 14px}.sectionhead h2{font-size:20px;letter-spacing:-.025em;margin:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-width:0}.card h3{margin:12px 0 6px;font-size:19px;letter-spacing:-.02em}.card p{color:var(--muted);font-size:13px;line-height:1.55}.tag{display:inline-block;border-radius:6px;background:#333039;color:#e6d6dd;font-size:11px;font-weight:750;padding:6px 8px}.tag.red{color:#ffa09c;background:#492629}.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}.workout{white-space:pre-wrap;background:#101115;border-radius:12px;padding:15px;color:#eeeeef;line-height:1.7;font-size:14px;border:1px solid #252831;word-wrap:break-word}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.field{display:grid;gap:7px}.field label{font-size:12px;color:#c5c5cc;font-weight:700}.field input,.field select,.field textarea{width:100%;background:#101115;color:#fff;border:1px solid #353840;border-radius:10px;padding:12px;outline:none}.field textarea{min-height:155px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.formgrid .wide{grid-column:1/-1}.note{border:1px dashed #53505b;background:#221f27;padding:14px;border-radius:12px;color:#cbc9d1;font-size:13px;line-height:1.6}.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.toast{position:fixed;bottom:20px;right:20px;background:#27362b;border:1px solid #3e6649;padding:14px;border-radius:11px;z-index:10}.footer{font-size:12px;color:#737782;margin-top:35px}.adminonly{display:none}@media(max-width:750px){.shell{display:block}.sidebar{padding:16px;border-right:0;border-bottom:1px solid var(--line);gap:14px}.brandmark{width:37px;height:37px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.switch{margin-top:0;padding-top:8px}.content{padding:22px 16px 55px}.stats{gap:8px}.stat{padding:14px}.stat b{font-size:25px}.cards{grid-template-columns:1fr}.hero{padding:24px}.formgrid{grid-template-columns:1fr}.head{align-items:flex-start}.head h1{font-size:28px}}

/* FP Experience upgrade */
html{scroll-behavior:smooth}.brand-logo{width:45px;height:45px;object-fit:contain;border-radius:10px}.brandmark:has(+.brand-logo){display:none}.quickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.quick{background:linear-gradient(145deg,#24252b,#131418);border:1px solid #32343c;padding:17px;border-radius:16px;color:white;text-align:left;min-height:105px}.quick b{display:block;font-size:15px;margin-top:9px}.quick span{font-size:12px;color:#a5a6ad}.searchbox{background:#14161b;border:1px solid #383b43;color:white;padding:12px 14px;border-radius:12px;flex:1;min-width:180px}.contact-card{background:linear-gradient(120deg,#2c1c21,#15161b);border:1px solid #543038;border-radius:20px;padding:25px}.contact-card p{color:#c2c0c5;line-height:1.65}.contact-card .btn{display:inline-block;text-decoration:none}.foot-link{background:none;border:0;color:#ff9690;cursor:pointer;font-weight:700}.daystrip{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 20px}.daystrip button{border:1px solid #3a3b42;background:#16171c;color:#d4d4dc;padding:9px 11px;border-radius:10px;font-size:12px}.daystrip button.active{background:#722f30;border-color:#a94b4a;color:#fff}.card{transition:transform .15s ease,border-color .15s ease}.card:hover{border-color:#4a3b40;transform:translateY(-2px)}.footer{border-top:1px solid #2c2d32;padding-top:20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}.panel-title{font-size:14px;letter-spacing:.12em;color:#fb8c86;text-transform:uppercase}@media(max-width:750px){.quickgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.quick{min-height:95px}.nav{scrollbar-width:none}.sidebar{position:sticky;top:0;background:#0b0c0ff2;z-index:4;backdrop-filter:blur(14px)}.head{margin-bottom:18px}}
</style></head>
<body><div id="app"></div><script>/* Forging Performance — Protótipo local. NÃO usar como autenticação em produção. */
(() => {
'use strict';
const STORAGE='fp_demo_v1';
const modalities=['CrossFit RX / Elite','CrossFit Teens','HYROX','Corrida','Musculação','CrossFit Comercial','Personalizado','Natação'];
const days=['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'];
const starter={athletes:[{id:'a1',name:'Atleta Exemplo',modalities:['CrossFit RX / Elite','HYROX']},{id:'a2',name:'Atleta Teens',modalities:['CrossFit Teens']}],workouts:[{id:'w1',title:'Condicionamento e resistência',modality:'CrossFit RX / Elite',day:'Segunda-feira',type:'general',athleteId:'',body:'AQUECIMENTO — 8 MIN\nMobilidade e preparação progressiva\n\nWOD — AMRAP 16 MIN\n200m RUN\n12 WALL BALL\n10 BURPEES\n\nObjetivo: ritmo sustentável e movimentos consistentes.',notes:'Treino demonstrativo. Substitua pela programação oficial.',createdAt:Date.now()},{id:'w2',title:'Base aeróbica',modality:'HYROX',day:'Quarta-feira',type:'general',athleteId:'',body:'FOR TIME — CAP 35 MIN\n800m RUN\n30 WALL BALL\n800m RUN\n30 BURPEE BROAD JUMP\n800m RUN\n40 LUNGES',notes:'Treino demonstrativo.',createdAt:Date.now()},{id:'w3',title:'Acompanhamento individual',modality:'Personalizado',day:'Sexta-feira',type:'individual',athleteId:'a1',body:'TÉCNICA — 15 MIN\nExercícios escolhidos após avaliação individual.\n\nREGISTRO\nAnotar sensação de esforço e principais dificuldades.',notes:'Exemplo individual, não prescrição definitiva.',createdAt:Date.now()}]};
const copy=(x)=>JSON.parse(JSON.stringify(x));
const load=()=>{try{const parsed=JSON.parse(localStorage.getItem(STORAGE));if(parsed&&Array.isArray(parsed.athletes)&&Array.isArray(parsed.workouts))return parsed;}catch{}return copy(starter)};
let data=load(),view='home',role='coach',athlete='a1',filter='Todas',editing=null,notice='',logging=null,searchTerm='',dayFilter='Todos';
const el=document.getElementById('app');
if(!Array.isArray(data.results))data.results=[];
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch{alert('Armazenamento local indisponível. As alterações podem não permanecer salvas.')}};
const esc=(str)=>String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const selectedAthlete=()=>data.athletes.find(a=>a.id===athlete);
const canSee=w=>role==='coach'||(w.type==='general'&&selectedAthlete()?.modalities.includes(w.modality))||(w.type==='individual'&&w.athleteId===athlete);
const usable=()=>data.workouts.filter(canSee).filter(w=>filter==='Todas'||w.modality===filter).filter(w=>dayFilter==='Todos'||w.day===dayFilter).filter(w=>!searchTerm||[w.title,w.modality,w.day,w.body].join(' ').toLowerCase().includes(searchTerm.toLowerCase()));
const myResult=w=>data.results.find(r=>r.workoutId===w.id&&r.athleteId===athlete);
const card=w=>`<article class="card"><span class="tag ${w.type==='individual'?'red':''}">${w.type==='general'?'PLANILHA GERAL':'INDIVIDUAL'}</span><h3>${esc(w.title)}</h3><p>${esc(w.day)} · ${esc(w.modality)}${w.type==='individual'?' · '+esc(data.athletes.find(a=>a.id===w.athleteId)?.name||'Sem atleta'):''}</p><div class="workout">${esc(w.body)}</div>${w.notes?`<p><strong>Orientação:</strong> ${esc(w.notes)}</p>`:''}<div class="cardfoot"><span class="muted" style="font-size:12px">${w.type==='general'?'Disponível para a modalidade':'Acesso direcionado'}</span>${role==='athlete'?`<span><button class="btn small primary" data-log="${esc(w.id)}">${myResult(w)?'Editar resultado':'Registrar resultado'}</button></span>`:''}${role==='coach'?`<span><button class="btn small" data-edit="${esc(w.id)}">Editar</button> <button class="btn small ghost" data-delete="${esc(w.id)}">Excluir</button></span>`:''}</div></article>`;
const viewName=()=>({home:'Visão geral',workouts:'Planilhas de treino',athletes:'Atletas',edit:editing?'Editar treino':'Novo treino',newathlete:'Adicionar atleta',results:'Meus resultados',backup:'Backup dos dados',contact:'Fale com seu coach',settings:'Configurações do coach'}[view]);
function render(){if(role==='athlete'&&(view==='edit'||view==='athletes'||view==='newathlete'||view==='backup'))view='home';const list=usable();el.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><img class="brand-logo" src="IMG_6597.jpeg" alt="Logo Forging Performance" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="brandmark" style="display:none">FP</div><div><strong>FORGING</strong><span>PERFORMANCE</span></div></div><nav class="nav"><button data-view="home" class="${view==='home'?'active':''}">⌂ Início</button><button data-view="workouts" class="${view==='workouts'?'active':''}">▦ Planilhas</button>${role==='coach'?`<button data-view="athletes" class="${view==='athletes'?'active':''}">♙ Atletas</button><button data-view="backup" class="${view==='backup'?'active':''}">⇩ Backup</button><button data-view="edit" class="${view==='edit'?'active':''}">＋ Publicar treino</button>`:`<button data-view="results" class="${view==='results'?'active':''}">◷ Meus resultados</button>`}<button data-view="contact" class="${view==='contact'?'active':''}">✉ Contato</button>${role==='coach'?`<button data-view="settings" class="${view==='settings'?'active':''}">⚙ Contato do coach</button>`:''}</nav><div class="switch"><label for="role">Prévia de acesso (demonstração)</label><select id="role"><option value="coach" ${role==='coach'?'selected':''}>Treinador / Admin</option><option value="athlete" ${role==='athlete'?'selected':''}>Atleta</option></select>${role==='athlete'?`<label for="athlete" style="margin-top:12px">Visualizar como</label><select id="athlete">${data.athletes.map(a=>`<option value="${esc(a.id)}" ${athlete===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`:''}</div></aside><main class="content"><header class="head"><div><span class="eyebrow">SEU TREINO. SUA EVOLUÇÃO.</span><h1>${esc(viewName())}</h1></div><span class="pill">VERSÃO DEMO</span></header>${content(list)}<div class="footer"><span>© Forging Performance · Versão de demonstração · Dados locais</span><button class="foot-link" data-view="contact">Precisa de ajuda? Fale com o coach →</button></div></main></div>${notice?`<div class="toast" role="status">${esc(notice)}</div>`:''}`;bind();}
function content(list){if(view==='home')return `<div class="hero"><span class="eyebrow">FORGING PERFORMANCE</span><h2>${role==='coach'?'Sua programação em um só lugar.':'Construa sua próxima evolução.'}</h2><p>${role==='coach'?'Publique planilhas gerais por modalidade e direcione treinos personalizados para cada atleta.':'Confira a programação liberada para suas modalidades e seus treinos individuais.'}</p><div class="actions"><button class="btn primary" data-view="workouts">Ver planilhas →</button>${role==='coach'?'<button class="btn" data-view="edit">＋ Publicar treino</button>':''}</div></div><div class="quickgrid"><button class="quick" data-view="workouts"><span>01 / ACESSAR</span><b>▦ Meus treinos →</b></button><button class="quick" data-view="${role==='coach'?'athletes':'results'}"><span>02 / ACOMPANHAR</span><b>${role==='coach'?'♙ Atletas':'◷ Minha evolução'} →</b></button><button class="quick" data-view="contact"><span>03 / SUPORTE</span><b>✉ Falar com coach →</b></button></div><section class="stats"><div class="stat"><b>${list.length}</b><span>Treinos visíveis</span></div><div class="stat"><b>${role==='coach'?data.athletes.length:selectedAthlete()?.modalities.length||0}</b><span>${role==='coach'?'Atletas cadastrados':'Modalidades ativas'}</span></div><div class="stat"><b>${list.filter(w=>w.type==='individual').length}</b><span>Treinos individuais</span></div></section><div class="sectionhead"><h2>Próximos treinos</h2><button class="btn small" data-view="workouts">Ver todos</button></div><div class="cards">${list.slice(0,4).map(card).join('')||'<div class="empty">Nenhum treino disponível.</div>'}</div>`;
if(view==='results')return `<div class="sectionhead"><h2>Meu histórico de resultados</h2></div><div class="cards">${data.results.filter(r=>r.athleteId===athlete).sort((a,b)=>b.createdAt-a.createdAt).map(r=>{const w=data.workouts.find(w=>w.id===r.workoutId);return `<article class="card"><span class="tag red">RESULTADO</span><h3>${esc(w?.title||'Treino excluído')}</h3><p>${esc(new Date(r.createdAt).toLocaleDateString('pt-BR'))}</p><div class="workout">${esc(r.value)}</div><p>${esc(r.notes||'')}</p></article>`}).join('')||'<div class="empty">Você ainda não registrou resultados. Acesse suas planilhas para começar.</div>'}</div>`;
if(view==='contact'){const phone=(data.coachContact?.whatsapp||'').replace(/\D/g,'');const insta=(data.coachContact?.instagram||'').replace(/^@/,'').trim();return `<div class="contact-card"><span class="panel-title">SUPORTE FORGING PERFORMANCE</span><h2>Seu coach está a um toque de distância.</h2><p>Dúvidas sobre cargas, adaptações, organização da semana ou alguma dificuldade no treino? Entre em contato com o treinador para receber orientação.</p><div class="actions">${phone?`<a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/${esc(phone)}?text=${encodeURIComponent('Olá, coach! Sou atleta da Forging Performance e tenho uma dúvida sobre meu treino.')}">Conversar no WhatsApp ↗</a>`:'<span class="note">WhatsApp ainda não cadastrado pelo coach.</span>'}${insta?`<a class="btn" target="_blank" rel="noopener" href="https://instagram.com/${encodeURIComponent(insta)}">Instagram ↗</a>`:''}</div></div><div class="card" style="margin-top:15px"><h3>Como pedir ajuda</h3><p>Informe seu nome, modalidade, dia do treino e a dúvida específica. Para adaptar um movimento, explique o equipamento disponível e suas limitações.</p></div>`;}
if(view==='settings'&&role==='coach')return `<div class="card"><h3>Central de contato do treinador</h3><p>Configure como os atletas encontram você. O número é usado apenas para montar o link do WhatsApp.</p><form id="contactform" class="formgrid"><div class="field"><label for="coachphone">WhatsApp com DDD</label><input id="coachphone" inputmode="tel" placeholder="Ex.: 5571999999999" value="${esc(data.coachContact?.whatsapp||'')}"></div><div class="field"><label for="coachinsta">Instagram (sem @)</label><input id="coachinsta" placeholder="seu.perfil" value="${esc(data.coachContact?.instagram||'')}"></div><div class="wide"><button class="btn primary" type="submit">Salvar contatos</button></div></form><p class="note">Nesta demonstração a configuração fica apenas neste navegador. Para disponibilizar seu contato a todos, ele deverá ser publicado na versão conectada ao banco de dados.</p></div>`;
if(view==='backup')return `<div class="card"><h3>Backup local das planilhas</h3><p>Salve uma cópia JSON dos atletas, treinos e resultados deste navegador. Para recuperar os dados, importe um backup salvo anteriormente.</p><div class="actions"><button class="btn primary" id="exportdata">↓ Exportar backup</button><label class="btn" for="importdata">↑ Importar backup</label><input id="importdata" type="file" accept=".json,application/json" hidden></div><p class="note">O backup pode conter informações pessoais. Guarde em local privado. A importação substitui os dados locais atuais; não envia nada para a nuvem.</p></div>`;
if(view==='workouts')return `<div class="toolbar"><input id="search-workouts" class="searchbox" placeholder="Buscar treino, movimento ou modalidade..." value="${esc(searchTerm)}" aria-label="Buscar treinos"><select id="filter" class="btn" aria-label="Filtrar modalidade"><option value="Todas">Todas as modalidades</option>${modalities.map(m=>`<option value="${esc(m)}" ${filter===m?'selected':''}>${esc(m)}</option>`).join('')}</select>${role==='coach'?'<button class="btn primary" data-view="edit">＋ Novo treino</button>':''}</div><div class="daystrip"><button data-day="Todos" class="${dayFilter==='Todos'?'active':''}">Todos</button>${days.map(d=>`<button data-day="${esc(d)}" class="${dayFilter===d?'active':''}">${esc(d.split('-')[0])}</button>`).join('')}</div><div class="cards">${list.map(card).join('')||'<div class="empty">Não há treinos para esse filtro.</div>'}</div>`;
if(view==='athletes')return `<div class="sectionhead"><h2>Cadastro de atletas</h2><button class="btn primary" data-view="newathlete">＋ Adicionar atleta</button></div><div class="cards">${data.athletes.map(a=>`<div class="card"><span class="tag">ATLETA</span><h3>${esc(a.name)}</h3><p>${a.modalities.map(esc).join(' · ')||'Sem modalidade'}</p><div class="cardfoot"><span class="muted">${data.workouts.filter(w=>w.type==='individual'&&w.athleteId===a.id).length} treino(s) individual(is)</span><button class="btn small" data-assign="${esc(a.id)}">Criar treino →</button></div></div>`).join('')}</div><p class="note">Este cadastro é demonstrativo. Na versão publicada, o cadastro e o login serão protegidos por autenticação e permissões no servidor.</p>`;
if(view==='newathlete')return `<form id="athleteform" class="card formgrid"><div class="field wide"><label for="aname">Nome do atleta</label><input id="aname" required maxlength="90" placeholder="Nome completo"></div><div class="field wide"><label for="amodalities">Modalidades (marque uma ou mais)</label><div style="display:grid;gap:9px">${modalities.map(m=>`<label><input type="checkbox" name="modality" value="${esc(m)}"> ${esc(m)}</label>`).join('')}</div></div><div class="wide actions"><button class="btn primary" type="submit">Salvar atleta</button><button class="btn ghost" type="button" data-view="athletes">Cancelar</button></div></form>`;
if(view==='edit'){const w=data.workouts.find(w=>w.id===editing)||{};return `<form id="workoutform" class="card formgrid"><div class="field wide"><label for="title">Nome do treino</label><input id="title" maxlength="100" required placeholder="Ex.: Resistência muscular — Semana 1" value="${esc(w.title||'')}"></div><div class="field"><label for="modality">Modalidade</label><select id="modality">${modalities.map(m=>`<option value="${esc(m)}" ${w.modality===m?'selected':''}>${esc(m)}</option>`).join('')}</select></div><div class="field"><label for="day">Dia da semana</label><select id="day">${days.map(d=>`<option ${w.day===d?'selected':''}>${esc(d)}</option>`).join('')}</select></div><div class="field"><label for="type">Tipo de planilha</label><select id="type"><option value="general" ${w.type!=='individual'?'selected':''}>Geral — para toda a modalidade</option><option value="individual" ${w.type==='individual'?'selected':''}>Individual — para um atleta</option></select></div><div class="field" id="athletewrap"><label for="target">Atleta destinatário</label><select id="target">${data.athletes.map(a=>`<option value="${esc(a.id)}" ${w.athleteId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="field wide"><label for="body">Programação (blocos, séries, repetições, cargas)</label><textarea id="body" required placeholder="AQUECIMENTO...\nTREINO A...\nTREINO B...">${esc(w.body||'')}</textarea></div><div class="field wide"><label for="notes">Dicas e adaptações (opcional)</label><textarea id="notes" style="min-height:85px" placeholder="Intenção do treino, escalas e orientações">${esc(w.notes||'')}</textarea></div><div class="wide actions"><button type="submit" class="btn primary">${editing?'Salvar alterações':'Publicar treino'}</button><button class="btn ghost" type="button" data-view="workouts">Cancelar</button></div></form>`;}
return '';}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;if(view==='edit')editing=null;filter='Todas';notice='';render()});document.getElementById('contactform')?.addEventListener('submit',e=>{e.preventDefault();const whatsapp=document.getElementById('coachphone').value.replace(/\D/g,'');if(whatsapp&&!(whatsapp.length>=12&&whatsapp.length<=13)){alert('Use código do país 55, DDD e número.');return}data.coachContact={whatsapp,instagram:document.getElementById('coachinsta').value.trim().replace(/^@/,'')};save();notice='Contato salvo nesta demonstração.';render()});document.getElementById('search-workouts')?.addEventListener('input',e=>{const v=e.target.value;searchTerm=v;const start=e.target.selectionStart;render();const i=document.getElementById('search-workouts');i?.focus();i?.setSelectionRange(start,start)});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{dayFilter=b.dataset.day;render()});document.getElementById('role').onchange=e=>{role=e.target.value;view='home';filter='Todas';render()};document.getElementById('athlete')?.addEventListener('change',e=>{athlete=e.target.value;render()});document.getElementById('filter')?.addEventListener('change',e=>{filter=e.target.value;render()});document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>{const w=data.workouts.find(x=>x.id===b.dataset.log);const existing=myResult(w);const value=prompt('Resultado do treino (tempo, rounds, carga ou repetições):',existing?.value||'');if(value===null)return;if(!value.trim()){alert('Informe um resultado.');return}const notes=prompt('Observações (opcional):',existing?.notes||'');if(notes===null)return;data.results=data.results.filter(r=>!(r.athleteId===athlete&&r.workoutId===w.id));data.results.push({athleteId:athlete,workoutId:w.id,value:value.trim().slice(0,300),notes:notes.trim().slice(0,500),createdAt:Date.now()});save();notice='Resultado registrado neste navegador.';render()});
document.getElementById('exportdata')?.addEventListener('click',()=>{const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='forging-performance-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)});
document.getElementById('importdata')?.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>3000000){alert('Arquivo muito grande.');return}try{const d=JSON.parse(await file.text());if(!Array.isArray(d.athletes)||!Array.isArray(d.workouts)||!d.athletes.every(a=>typeof a.id==='string'&&typeof a.name==='string'&&Array.isArray(a.modalities))||!d.workouts.every(w=>typeof w.id==='string'&&typeof w.title==='string'&&typeof w.body==='string'))throw Error('Formato inválido');if(!confirm('Substituir todos os dados locais pelo backup importado?'))return;data={athletes:d.athletes,workouts:d.workouts,results:Array.isArray(d.results)?d.results:[]};save();view='home';notice='Backup importado.';render()}catch{alert('Não foi possível importar: arquivo inválido.')}});
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;view='edit';render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Excluir este treino?'))return;data.workouts=data.workouts.filter(w=>w.id!==b.dataset.delete);save();notice='Treino excluído.';render()});document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>{editing=null;view='edit';render();document.getElementById('type').value='individual';document.getElementById('target').value=b.dataset.assign;syncTarget()});document.getElementById('type')?.addEventListener('change',syncTarget);syncTarget();document.getElementById('workoutform')?.addEventListener('submit',e=>{e.preventDefault();const val=id=>document.getElementById(id).value.trim();const type=val('type');if(type==='individual'&&!val('target')){alert('Cadastre um atleta antes de criar treinos individuais.');return}const workout={id:editing||'w'+Date.now()+'-'+Math.random().toString(36).slice(2,7),title:val('title'),modality:val('modality'),day:val('day'),type,athleteId:type==='individual'?val('target'):'',body:val('body'),notes:val('notes'),createdAt:Date.now()};if(editing)data.workouts=data.workouts.map(w=>w.id===editing?workout:w);else data.workouts.unshift(workout);save();view='workouts';editing=null;filter='Todas';notice='Treino salvo neste navegador.';render()});document.getElementById('athleteform')?.addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('aname').value.trim();const ms=[...document.querySelectorAll('input[name=modality]:checked')].map(x=>x.value);if(!ms.length){alert('Selecione pelo menos uma modalidade.');return}data.athletes.push({id:'a'+Date.now(),name,modalities:ms});save();view='athletes';notice='Atleta cadastrado neste navegador.';render()})}
function syncTarget(){const wrap=document.getElementById('athletewrap'),type=document.getElementById('type');if(wrap&&type)wrap.style.display=type.value==='individual'?'grid':'none'}
render();
})();
</script></body></html>
